services:
  webapi:
    image: ghcr.io/alandelac/3d_printing_hub_api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: 3dprintinghub-api
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/data/printinghub.db
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - AllowedOrigin=${FRONTEND_URL:-http://localhost}
    volumes:
      - printinghub-data:/data
    networks:
      - app-net

  frontend:
    image: ghcr.io/alandelac/3d_printing_hub_frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: 3dprintinghub-frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - webapi
    networks:
      - app-net

volumes:
  printinghub-data:

networks:
  app-net:
    driver: bridge
