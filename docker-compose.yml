services:
  webapi:
    image: ghcr.io/alandelac/3d_printing_hub_api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: 3dprintinghub-api
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/data/printinghub.db
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - AllowedOrigin=${FRONTEND_URL:-http://localhost}
    volumes:
      - printinghub-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/alandelac/3d_printing_hub_frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: 3dprintinghub-frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      webapi:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  printinghub-data:

networks:
  app-net:
    driver: bridge
