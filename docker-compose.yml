services:
  db:
    image: postgres:16-alpine
    container_name: 3dprintinghub-db
    restart: always
    environment:
      POSTGRES_DB: printinghub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net

  webapi:
    image: ghcr.io/alandelac/3d_printing_hub_api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: 3dprintinghub-api
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=printinghub;Username=postgres;Password=${DB_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - AllowedOrigin=${FRONTEND_URL:-http://localhost}
    depends_on:
      - db
    networks:
      - app-net

  frontend:
    image: ghcr.io/alandelac/3d_printing_hub_frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: 3dprintinghub-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - webapi
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge