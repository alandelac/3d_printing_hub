services:
  db:
    image: postgres:16-alpine
    container_name: 3dprintinghub-db
    restart: always
    environment:
      POSTGRES_DB: printinghub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      :/var/lib/postgresql/data
    networks:
      - app-net

  webapi:
    image: ghcr.io/alandelac/3d_printing_hub_api:latest
    container_name: 3dprintinghub-api
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=printinghub;Username=postgres;Password=${DB_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - db
    networks:
      - app-net

  frontend:
    image: ghcr.io/alandelac/3d_printing_hub_frontend:latest
    container_name: 3dprintinghub-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - webapi
    networks:
      - app-net

networks:
  app-net:
    driver: bridge