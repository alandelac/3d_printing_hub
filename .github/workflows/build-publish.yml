name: Build and Publish Images

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-check:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET dependencies
        run: dotnet restore src/3DPrintingHub.slnx --nologo

      - name: Build .NET solution
        run: dotnet build src/3DPrintingHub.slnx --configuration Release --no-restore --nologo

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/3DPrintingHub.Client/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/3DPrintingHub.Client
        run: npm ci

      - name: Build frontend application
        working-directory: src/3DPrintingHub.Client
        run: npm run build

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET dependencies
        run: dotnet restore src/3DPrintingHub.slnx --nologo

      - name: Run backend tests
        run: dotnet test src/3DPrintingHub.slnx --configuration Release --no-restore --nologo

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/3DPrintingHub.Client/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/3DPrintingHub.Client
        run: npm ci

      - name: Run frontend tests
        working-directory: src/3DPrintingHub.Client
        run: npm test -- --watch=false

  frontend-coverage:
    name: frontend-coverage
    runs-on: ubuntu-latest
    needs: frontend-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/3DPrintingHub.Client/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/3DPrintingHub.Client
        run: npm ci

      - name: Run frontend coverage gate
        working-directory: src/3DPrintingHub.Client
        run: npm test -- --watch=false

  build-and-push:
    name: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-check, backend-tests, frontend-tests, frontend-coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}_api:latest
          platforms: linux/amd64,linux/arm64

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}_frontend:latest
          platforms: linux/amd64,linux/arm64
