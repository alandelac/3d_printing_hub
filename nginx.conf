server {
    listen 80;
    server_name localhost;

    location = /health {
        proxy_pass http://webapi:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Redirigir llamadas de la API al contenedor del backend de .NET
    location /api {
        proxy_pass http://webapi:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Identity API routes are mapped at the application root, not under /api.
    location ~ ^/(login|register|refresh|confirmEmail|resendConfirmationEmail|forgotPassword|resetPassword)$ {
        proxy_pass http://webapi:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # GET is a browser navigation; serve the SPA while POST reaches Identity.
        proxy_intercept_errors on;
        error_page 405 =200 /index.html;
    }

    location /manage/ {
        proxy_pass http://webapi:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}