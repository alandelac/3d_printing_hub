<app-modal [title]="isEditing() ? 'Edit Product Stock' : 'Add New Product Stock'" (close)="cancel.emit()">
  <div class="add-form">
    <label>Model Print:</label>
    <select [value]="modelPrintId()" (change)="modelPrintId.set($any($event.target).value)">
      <option value="">Select Model</option>
      <option *ngFor="let m of models()" [value]="m.id" [selected]="m.id === modelPrintId()">{{ m.name }}</option>
    </select>

    <label>Filament:</label>
    <select [value]="filamentId()" (change)="filamentId.set($any($event.target).value)">
      <option value="">Select Filament</option>
      <option *ngFor="let f of filaments()" [value]="f.id" [selected]="f.id === filamentId()">
        {{ f.filamentProfile.brandName }} - {{ f.filamentProfile.materialTypeName }} - {{ f.colorName }}
      </option>
    </select>

    <label>Quantity In Stock:</label>
    <input
      type="number"
      min="0"
      placeholder="Quantity"
      [value]="quantityInStock()"
      (input)="onQuantityInput($any($event.target).value)"
    />

    <label>Sale Price (per unit, optional):</label>
    <input
      type="number"
      min="0"
      step="0.01"
      placeholder="0.00 (uses recommended)"
      [value]="salePrice()"
      (input)="onSalePriceInput($any($event.target).value)"
    />
    <span class="form-hint">Leave at 0 to automatically use the recommended sale price (double the cost).</span>

    <div class="modal-actions">
      <button class="primary" (click)="onSave()" [disabled]="loading()">
        {{ loading() ? 'Saving...' : (isEditing() ? 'Update' : 'Add Product Stock') }}
      </button>
      <button class="secondary" (click)="cancel.emit()" [disabled]="loading()">Cancel</button>
    </div>
  </div>
</app-modal>
