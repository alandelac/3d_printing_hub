<section class="stocked-page">
  <h2>{{ title() }}</h2>

  <div class="actions">
    <button class="primary" (click)="openCreateModal()">Add New Product Stock</button>
  </div>

  <!-- Product Stock Creation / Edition Modal -->
  <app-stock-form-modal
    *ngIf="open()"
    [models]="models()"
    [filaments]="filaments()"
    [stock]="editingStock()"
    [loading]="loading()"
    (save)="saveStock($event)"
    (cancel)="closeStockModal()"
  />

  <!-- Product Stocks Table -->
  <div class="table-section">
    <h3>Product Stock</h3>
    <app-table
      [columns]="columns"
      [rows]="productStocks()"
      [loading]="productStocksLoading()"
      emptyText="No product stock found."
      (edit)="openEditStock($event)"
      (delete)="deleteStockConfirm($event)"
    >
      <ng-template appTableCell="quantity" let-stock>
        <span class="qty-display">{{ stock.quantityInStock }}</span>
        <span class="qty-adjust">
          <input
            type="number"
            min="1"
            placeholder="0"
            [value]="getAdjustInput(stock.id)"
            (input)="setAdjustInput(stock.id, $any($event.target).value)"
            [disabled]="adjustingId() === stock.id"
          />
          <button class="secondary" (click)="adjustQuantity(stock, 'add')" [disabled]="adjustingId() === stock.id">+</button>
          <button class="secondary" (click)="adjustQuantity(stock, 'subtract')" [disabled]="adjustingId() === stock.id">−</button>
        </span>
      </ng-template>
    </app-table>
  </div>

  <!-- Generic Delete Confirmation Modal (product stock table) -->
  <app-confirm-delete
    *ngIf="deleteOpen()"
    title="Delete Record"
    [entityName]="deleteName()"
    [loading]="deleteLoading()"
    (confirm)="confirmDelete()"
    (cancel)="closeDeleteModal()"
  />
</section>
