<section class="models-page">
  <h2>{{ title() }}</h2>
  <div class="actions">
    <button class="primary" (click)="toggleModelOpen()">New Model</button>
    <button class="secondary" (click)="toggleCategoryOpen()">Category</button>
  </div>

  <!-- Model Creation Modal -->
  <app-model-form-modal
    *ngIf="modelOpen()"
    [categories]="categories()"
    [loading]="modelLoading()"
    (save)="createModel($event)"
    (cancel)="toggleModelOpen()"
  />

  <!-- Models List (filtering, ordering and the empty/loading states come from the shared table) -->
  <app-table
    [columns]="columns"
    [rows]="models()"
    [loading]="modelsLoading()"
    emptyText="No models found. Create your first model above."
    filterPlaceholder="Filter models…"
    (edit)="openEditModal($event)"
    (delete)="openDeleteModal($event)"
  >
    <ng-template appTableCell="defaultCost" let-model>
      {{ model.defaultCost | number:'1.2-2' }}
    </ng-template>
    <ng-template appTableCell="defaultSalePrice" let-model>
      {{ model.defaultSalePrice | number:'1.2-2' }}
    </ng-template>
    <ng-template appTableCell="margin" let-model>
      <ng-container *ngIf="marginPercent(model.defaultCost, model.defaultSalePrice) !== null; else unavailableMargin">
        <span [ngClass]="marginClass(marginPercent(model.defaultCost, model.defaultSalePrice))">
          {{ marginPercent(model.defaultCost, model.defaultSalePrice) | number:'1.0-2' }}%
        </span>
      </ng-container>
      <ng-template #unavailableMargin>—</ng-template>
    </ng-template>
  </app-table>

  <!-- Edit Model Modal -->
  <app-model-form-modal
    *ngIf="editOpen()"
    [categories]="categories()"
    [model]="editModel()"
    [loading]="editLoading()"
    (save)="updateModel($event)"
    (cancel)="closeEditModal()"
  />

  <!-- Generic Delete Confirmation Modal (shared by model and category tables) -->
  <app-confirm-delete
    *ngIf="deleteOpen()"
    title="Delete Record"
    [entityName]="deleteName()"
    [loading]="deleteLoading()"
    (confirm)="confirmDelete()"
    (cancel)="closeDeleteModal()"
  />

  <!-- Category Modal -->
  <app-category-modal
    *ngIf="categoryOpen()"
    [categories]="categories()"
    [loading]="categoryLoading()"
    (save)="saveCategory($event)"
    (remove)="deleteCategoryConfirm($event)"
    (close)="toggleCategoryOpen()"
  />
</section>
