<section class="print-jobs-page">
  <h2>{{ title() }}</h2>

  <div class="actions">
    <button class="primary" type="button" (click)="openCreateForm()">Add print job</button>
  </div>

  <app-print-job-form
    *ngIf="formOpen()"
    [models]="models()"
    [filaments]="filaments()"
    [loading]="loading()"
    [error]="validationError()"
    (save)="savePrintJob($event)"
    (cancel)="closeForm()"
  />

  <app-table
    [columns]="columns"
    [rows]="printJobs()"
    [loading]="loading()"
    emptyText="No print jobs found."
    filterPlaceholder="Filter print jobs…"
    [showActions]="false"
  >
    <ng-template appTableCell="modelPrintName" let-job>
      {{ job.modelPrintName ?? 'Unknown model' }}
    </ng-template>

    <ng-template appTableCell="filamentName" let-job>
      {{ job.filamentName ?? 'Unknown filament' }}
    </ng-template>

    <ng-template appTableCell="printedAt" let-job>
      {{ job.printedAt | dateFormat }}
    </ng-template>

    <ng-template appTableCell="calculatedMaterialCost" let-job>
      {{ job.calculatedMaterialCost | currency:'USD':'symbol':'1.2-2' }}
    </ng-template>
  </app-table>

  <p *ngIf="validationError()" class="validation-error">{{ validationError() }}</p>
</section>
