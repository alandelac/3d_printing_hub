<section class="job-form">
  <h3>Record completed print</h3>

  <form (ngSubmit)="onSubmit()">
    <div class="field-row">
      <div>
        <label for="modelSearch">Search models</label>
        <input id="modelSearch" type="search" placeholder="Search by model name" [value]="modelSearch()" (input)="modelSearch.set($any($event.target).value)" />
        <label for="modelPrintId">Model</label>
        <select id="modelPrintId" [ngModel]="modelPrintId()" (ngModelChange)="modelPrintId.set($event)" [ngModelOptions]="{standalone: true}">
          <option value="">Select model</option>
          <option *ngFor="let model of filteredModels()" [value]="model.id">{{ model.name }}</option>
        </select>
      </div>

      <div>
        <label for="filamentSearch">Search filaments</label>
        <input id="filamentSearch" type="search" placeholder="Search by brand, material, or color" [value]="filamentSearch()" (input)="filamentSearch.set($any($event.target).value)" />
        <label for="filamentId">Filament</label>
        <select id="filamentId" [ngModel]="filamentId()" (ngModelChange)="filamentId.set($event)" [ngModelOptions]="{standalone: true}">
          <option value="">Select filament</option>
          <option *ngFor="let filament of filteredFilaments()" [value]="filament.id">{{ filament.filamentProfile.brandName }} {{ filament.filamentProfile.materialTypeName }} - {{ filament.colorName }} ({{ filament.remainingWeightGrams }}g left)</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <label>
        Produced quantity
        <input id="producedQuantity" type="number" min="1" [value]="producedQuantity()" (input)="producedQuantity.set($any($event.target).value)" />
      </label>

      <label>
        Used weight (g)
        <input id="usedWeightGrams" type="number" [value]="calculatedWeightGrams() || ''" readonly />
      </label>
    </div>

    <label>
      Notes
      <textarea [value]="notes()" (input)="notes.set($any($event.target).value)"></textarea>
    </label>

    <div class="form-actions">
      <button type="button" class="secondary" (click)="cancel.emit()">Cancel</button>
      <button type="submit" class="primary" [disabled]="loading">{{ loading ? 'Saving…' : 'Save job' }}</button>
    </div>

  </form>
</section>
