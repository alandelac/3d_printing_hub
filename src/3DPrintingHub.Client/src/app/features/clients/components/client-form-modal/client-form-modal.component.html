<app-modal [title]="client() ? 'Edit Client' : 'Add Client'" (close)="cancel.emit()">
  <div class="client-form">
    <label>Name:</label>
    <input type="text" [value]="name()" (input)="name.set($any($event.target).value)" />

    <label>Contact Platform:</label>
    <select [value]="contactPlatform()" (change)="contactPlatform.set($any($event.target).value)">
      <option value="WhatsApp">WhatsApp</option>
      <option value="Facebook">Facebook</option>
      <option value="PhoneCall">PhoneCall</option>
    </select>

    <label>Phone:</label>
    <input type="tel" [value]="phone()" (input)="phone.set($any($event.target).value)" />

    <label>Email:</label>
    <input type="email" [value]="email()" (input)="email.set($any($event.target).value)" />

    <button class="primary" type="button" (click)="onSubmit()" [disabled]="loading()">
      {{ loading() ? 'Saving...' : 'Save Client' }}
    </button>
    <button class="secondary" type="button" (click)="cancel.emit()" [disabled]="loading()">Cancel</button>
  </div>
</app-modal>
