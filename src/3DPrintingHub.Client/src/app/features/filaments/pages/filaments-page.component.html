<section class="filaments-page">
  <h2>{{ title() }}</h2>
  <div class="actions">
    <button class="primary" (click)="toggleOpen()">Colors</button>
    <button class="primary" (click)="toggleBrandOpen()">Brands</button>
    <button class="primary" (click)="toggleMaterialTypeOpen()">Material Types</button>
    <button class="primary" (click)="toggleProfileOpen()">Filament Profiles</button>
  </div>

  <div class="actions">
    <button class="primary" (click)="toggleFilamentForm()">Add New Filament</button>
  </div>

  <!-- Filament Modal -->
  <app-modal *ngIf="filamentFormOpen()" title="Add New Filament" (close)="toggleFilamentForm()">
    <div class="add-form">
          <label>Filament Profile:</label>
          <select [value]="filamentProfileId()" (change)="filamentProfileId.set($any($event.target).value)">
            <option value="">Select Profile</option>
            <option *ngFor="let p of profiles()" [value]="p.id">{{ p.brandName }} - {{ p.materialTypeName }}</option>
          </select>

          <label>Color:</label>
          <app-color-select
            [colors]="colors()"
            [value]="filamentColorId()"
            (valueChange)="filamentColorId.set($event)"
          />

          <label>Min Cost:</label>
          <input type="number" placeholder="Min Cost" [value]="filamentMinCost()" (input)="filamentMinCost.set($any($event.target).value ? +$any($event.target).value : null)" />

          <label>Max Cost:</label>
          <input type="number" placeholder="Max Cost" [value]="filamentMaxCost()" (input)="filamentMaxCost.set($any($event.target).value ? +$any($event.target).value : null)" />

          <label>Last Cost:</label>
          <input type="number" placeholder="Last Cost" [value]="filamentLastCost()" (input)="filamentLastCost.set($any($event.target).value ? +$any($event.target).value : null)" />

          <label>Remaining Weight (grams, optional):</label>
          <input type="number" placeholder="Remaining Weight" [value]="filamentRemainingWeight()" (input)="filamentRemainingWeight.set($any($event.target).value ? +$any($event.target).value : null)" />

          <label>Last Purchase Date (optional):</label>
          <input type="date" [value]="filamentLastPurchaseDate()" (input)="filamentLastPurchaseDate.set($any($event.target).value)" />

          <label>Buy Link (optional):</label>
          <input placeholder="https://..." [value]="filamentBuyLink()" (input)="filamentBuyLink.set($any($event.target).value)" />

          <label>
            <input type="checkbox" [checked]="filamentBuyAgain()" (change)="filamentBuyAgain.set($any($event.target).checked)" />
            Buy Again
          </label>

          <button class="primary" (click)="addFilament()">Add Filament</button>
        <button class="secondary" (click)="toggleFilamentForm()">Cancel</button>
    </div>
  </app-modal>

  <!-- Filaments Table (filtering, ordering and the list states come from the shared table) -->
  <div class="table-section">
    <h3>Filaments</h3>
    <app-table
      [columns]="filamentColumns"
      [rows]="filaments()"
      [loading]="filamentLoading()"
      emptyText="No filaments found."
      filterPlaceholder="Filter filaments…"
      (edit)="openEditModal($event)"
      (delete)="openDeleteModal($event)"
    >
      <ng-template appTableCell="profile" let-f>{{ f.filamentProfile.brandName }} - {{ f.filamentProfile.materialTypeName }}</ng-template>
      <ng-template appTableCell="color" let-f><span class="swatch" [style.background]="f.colorCode"></span> {{ f.colorName }}</ng-template>
      <ng-template appTableCell="remainingWeight" let-f>
        <div class="weight-adjuster">
          <span>{{ f.remainingWeightGrams }}g</span>
          <input
            type="number"
            min="0"
            step="1"
            [value]="getInlineWeightAdjustment(f.id) ?? ''"
            (input)="setInlineWeightAdjustment(f.id, $any($event.target).value)"
            aria-label="Adjust remaining weight for {{ f.filamentProfile.brandName }} {{ f.filamentProfile.materialTypeName }}"
          />
          <button class="success" type="button" (click)="applyInlineWeightAdjustment(f, 'add')">+</button>
          <button class="danger" type="button" (click)="applyInlineWeightAdjustment(f, 'subtract')">−</button>
          <button class="primary" type="button" (click)="applyInlineWeightAdjustment(f, 'set')">Update</button>
        </div>
      </ng-template>
      <ng-template appTableCell="minCost" let-f>${{ f.minCost }}</ng-template>
      <ng-template appTableCell="maxCost" let-f>${{ f.maxCost }}</ng-template>
      <ng-template appTableCell="lastCost" let-f>${{ f.lastCost }}</ng-template>
      <ng-template appTableCell="lastPurchaseDate" let-f>{{ f.lastPurchaseDate | dateFormat }}</ng-template>
      <ng-template appTableCell="buyAgain" let-f>{{ f.buyAgain ? 'Yes' : 'No' }}</ng-template>
      <ng-template appTableCell="buyLink" let-f>
        <a *ngIf="f.buyLink" [href]="f.buyLink" target="_blank" rel="noopener noreferrer">Link</a>
        <span *ngIf="!f.buyLink">-</span>
      </ng-template>
    </app-table>
  </div>

  <!-- Edit Filament Modal -->
  <app-modal *ngIf="editOpen()" title="Edit Filament" (close)="closeEditModal()">
    <div class="add-form">
          <label>Remaining Weight (grams):</label>
          <input type="number" placeholder="Remaining Weight" [value]="editRemainingWeight()" (input)="editRemainingWeight.set($any($event.target).value ? +$any($event.target).value : null)" />

          <label>Min Cost:</label>
          <input type="number" placeholder="Min Cost" [value]="editMinCost()" (input)="editMinCost.set($any($event.target).value ? +$any($event.target).value : null)" />

          <label>Max Cost:</label>
          <input type="number" placeholder="Max Cost" [value]="editMaxCost()" (input)="editMaxCost.set($any($event.target).value ? +$any($event.target).value : null)" />

          <label>Last Cost:</label>
          <input type="number" placeholder="Last Cost" [value]="editLastCost()" (input)="editLastCost.set($any($event.target).value ? +$any($event.target).value : null)" />

          <label>Last Purchase Date (optional):</label>
          <input type="date" [value]="editLastPurchaseDate()" (input)="editLastPurchaseDate.set($any($event.target).value)" />

          <label>Buy Link (optional):</label>
          <input placeholder="https://..." [value]="editBuyLink()" (input)="editBuyLink.set($any($event.target).value)" />

          <label>
            <input type="checkbox" [checked]="editBuyAgain()" (change)="editBuyAgain.set($any($event.target).checked)" />
            Buy Again
          </label>

          <button class="primary" (click)="updateFilament()" [disabled]="editLoading()">Save Changes</button>
        <button class="secondary" (click)="closeEditModal()" [disabled]="editLoading()">Cancel</button>
    </div>
  </app-modal>

  <!-- Adjust Weight Modal -->
  <app-modal *ngIf="adjustWeightOpen()" title="Adjust Filament Weight" (close)="closeAdjustWeightModal()">
    <div class="add-form">
          <label>Quantity (grams):</label>
          <input type="number" placeholder="Enter grams" [value]="adjustWeightGrams()" (input)="adjustWeightGrams.set($any($event.target).value ? +$any($event.target).value : null)" />

          <div class="modal-actions">
            <button class="primary" (click)="adjustWeight('add')" [disabled]="adjustWeightLoading()">Add</button>
            <button class="danger" (click)="adjustWeight('subtract')" [disabled]="adjustWeightLoading()">Subtract</button>
          </div>

          <button class="secondary" (click)="closeAdjustWeightModal()" [disabled]="adjustWeightLoading()">Cancel</button>
    </div>
  </app-modal>

  <!-- Generic Delete Confirmation Modal (shared by filament, brand, color, material type and profile tables) -->
  <app-confirm-delete
    *ngIf="deleteOpen()"
    title="Delete Record"
    [entityName]="deleteName()"
    [loading]="deleteLoading()"
    (confirm)="confirmDelete()"
    (cancel)="closeDeleteModal()"
  />

  <!-- Colors Modal -->
  <app-colors-modal
    *ngIf="open()"
    [colors]="colors()"
    [loading]="loading()"
    (addColor)="createColor($event)"
    (updateColor)="updateColor($event)"
    (deleteColor)="deleteColorConfirm($event)"
    (close)="closeModal()"
  />

  <!-- Brands Modal -->
  <app-brands-modal
    *ngIf="brandOpen()"
    [brands]="brands()"
    [loading]="brandLoading()"
    (addBrand)="createBrand($event)"
    (updateBrand)="updateBrand($event)"
    (deleteBrand)="deleteBrandConfirm($event)"
    (close)="closeBrandModal()"
  />

  <!-- Material Types Modal -->
  <app-material-types-modal
    *ngIf="materialTypeOpen()"
    [materialTypes]="materialTypes()"
    [loading]="materialTypeLoading()"
    (addMaterialType)="createMaterialType($event)"
    (updateMaterialType)="updateMaterialType($event)"
    (deleteMaterialType)="deleteMaterialTypeConfirm($event)"
    (close)="closeMaterialTypeModal()"
  />

  <!-- Filament Profiles Modal -->
  <app-modal *ngIf="profileOpen()" title="Filament Profiles" (close)="closeProfileModal()">
    <div class="add-form">
          <label>Brand:</label>
          <select [value]="profileBrandId()" (change)="profileBrandId.set($any($event.target).value)">
            <option value="">Select Brand</option>
            <option *ngFor="let b of brands()" [value]="b.id">{{ b.name }}</option>
          </select>

          <label>Material Type:</label>
          <select [value]="profileMaterialTypeId()" (change)="profileMaterialTypeId.set($any($event.target).value)">
            <option value="">Select Material Type</option>
            <option *ngFor="let mt of materialTypes()" [value]="mt.id">{{ mt.name }}</option>
          </select>

          <label>Ironing Flow % (optional):</label>
          <input type="number" placeholder="Ironing Flow %" [value]="profileIroningFlow()" (input)="profileIroningFlow.set($any($event.target).value ? +$any($event.target).value : null)" />

          <label>Ironing Speed mm/s (optional):</label>
          <input type="number" placeholder="Ironing Speed" [value]="profileIroningSpeed()" (input)="profileIroningSpeed.set($any($event.target).value ? +$any($event.target).value : null)" />

          <label>Slope Angle (optional):</label>
          <input type="number" placeholder="Slope Angle" [value]="profileSlopeAngle()" (input)="profileSlopeAngle.set($any($event.target).value ? +$any($event.target).value : null)" />

          <label>Z Separation (optional):</label>
          <input type="number" placeholder="Z Separation" [value]="profileZSeparation()" (input)="profileZSeparation.set($any($event.target).value ? +$any($event.target).value : null)" />

          <button class="primary" (click)="saveProfile()">{{ isEditingProfile() ? 'Save Changes' : 'Add Filament Profile' }}</button>
          <button *ngIf="isEditingProfile()" class="secondary" (click)="cancelEditProfile()">Cancel</button>
        </div>

        <app-table
          [columns]="profileColumns"
          [rows]="profiles()"
          [loading]="profileLoading()"
          emptyText="No filament profiles found."
          filterPlaceholder="Filter profiles…"
          (edit)="startEditProfile($event)"
          (delete)="deleteProfileConfirm($event)"
        />
  </app-modal>
</section>
