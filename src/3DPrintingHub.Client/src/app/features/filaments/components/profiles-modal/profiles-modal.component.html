<app-modal title="Filament Profiles" (close)="onClose()">
  <div class="add-form">
    <label>Brand:</label>
    <select [value]="profileBrandId" (change)="profileBrandId = $any($event.target).value">
      <option value="">Select Brand</option>
      <option *ngFor="let b of brands" [value]="b.id">{{ b.name }}</option>
    </select>

    <label>Material Type:</label>
    <select [value]="profileMaterialTypeId" (change)="profileMaterialTypeId = $any($event.target).value">
      <option value="">Select Material Type</option>
      <option *ngFor="let mt of materialTypes" [value]="mt.id">{{ mt.name }}</option>
    </select>

    <label>Ironing Flow %:</label>
    <input type="number" [value]="profileIroningFlow" (input)="profileIroningFlow = $any($event.target).value ? +$any($event.target).value : null" />

    <label>Ironing Speed mm/s:</label>
    <input type="number" [value]="profileIroningSpeed" (input)="profileIroningSpeed = $any($event.target).value ? +$any($event.target).value : null" />

    <label>Slope Angle:</label>
    <input type="number" [value]="profileSlopeAngle" (input)="profileSlopeAngle = $any($event.target).value ? +$any($event.target).value : null" />

    <label>Z Separation:</label>
    <input type="number" [value]="profileZSeparation" (input)="profileZSeparation = $any($event.target).value ? +$any($event.target).value : null" />

    <button class="primary" (click)="onAdd()">Add Filament Profile</button>
  </div>

  <app-list-state [loading]="loading" [hasData]="profiles.length > 0" emptyText="No filament profiles found.">
    <table>
      <thead>
        <tr>
          <th>Brand</th>
          <th>Material Type</th>
          <th>Ironing Flow %</th>
          <th>Ironing Speed</th>
          <th>Slope Angle</th>
          <th>Z Separation</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of profiles">
          <td>{{ p.brandName }}</td>
          <td>{{ p.materialTypeName }}</td>
          <td>{{ p.ironingFlowPercentage }}</td>
          <td>{{ p.ironingSpeedMmS }}</td>
          <td>{{ p.slopeAngleForSupports }}</td>
          <td>{{ p.zSeparationForSupports }}</td>
        </tr>
      </tbody>
    </table>
  </app-list-state>
</app-modal>
