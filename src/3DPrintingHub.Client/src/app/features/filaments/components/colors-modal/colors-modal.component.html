<app-modal title="Filament Colors" (close)="onClose()">
  <div class="add-form">
    <input placeholder="Color name" [value]="name" (input)="name = $event.target?.value" />
    <input placeholder="#RRGGBB" [value]="code" (input)="code = $event.target?.value" />
    <button class="primary" (click)="onAdd()">{{ isEditing ? 'Save Changes' : 'Add' }}</button>
    <button *ngIf="isEditing" class="secondary" (click)="cancelEdit()">Cancel</button>
  </div>

  <app-table [columns]="columns" [rows]="colors" [loading]="loading" emptyText="No colors found."
    filterPlaceholder="Filter colors…"
    (edit)="startEdit($event)" (delete)="onDelete($event)">
    <ng-template appTableCell="colorCode" let-color>
      <span class="swatch" [style.background]="color.colorCode"></span>{{ color.colorCode }}
    </ng-template>
  </app-table>
</app-modal>
