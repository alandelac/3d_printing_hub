<app-modal title="Filament Material Types" (close)="onClose()">
  <div class="add-form">
    <input placeholder="Material Type name" [value]="nameInput" (input)="nameInput = $event.target?.value" />
    <button class="primary" (click)="onAdd()">{{ isEditing ? 'Save Changes' : 'Add' }}</button>
    <button *ngIf="isEditing" class="secondary" (click)="cancelEdit()">Cancel</button>
  </div>

  <app-table [columns]="columns" [rows]="materialTypes" [loading]="loading" emptyText="No material types found."
    filterPlaceholder="Filter material types…"
    (edit)="startEdit($event)" (delete)="onDelete($event)" />
</app-modal>
