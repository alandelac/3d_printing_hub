<app-modal title="Edit Setting" (close)="cancel.emit()">
  <div class="add-form">
    <label>Parameter:</label>
    <input
      type="text"
      [value]="parameter()"
      (input)="parameter.set($any($event.target).value)"
      readonly
    />

    <label>Value:</label>
    <input
      type="number"
      step="0.01"
      [value]="value()"
      (input)="value.set($any($event.target).value ? +$any($event.target).value : null)"
    />

    <button class="primary" (click)="onSave()" [disabled]="loading()">
      {{ loading() ? 'Saving...' : 'Save Changes' }}
    </button>
    <button class="secondary" (click)="cancel.emit()" [disabled]="loading()">Cancel</button>
  </div>
</app-modal>
