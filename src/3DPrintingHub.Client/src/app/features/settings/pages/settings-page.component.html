<section class="settings-page">
  <h2>{{ title() }}</h2>

  <!-- Settings Table -->
  <div class="table-section">
    <h3>Application Settings</h3>
    <app-table
      [columns]="columns"
      [rows]="settings()"
      [loading]="loading()"
      [showActions]="false"
      emptyText="No settings found."
      filterPlaceholder="Filter settings…"
    >
      <ng-template appTableCell="actions" let-setting>
        <button class="secondary" (click)="openEditModal(setting)">Edit</button>
      </ng-template>
    </app-table>
  </div>

  <!-- Edit Setting Modal -->
  <app-setting-form-modal
    *ngIf="editOpen()"
    [setting]="editSetting()"
    [loading]="editLoading()"
    (save)="updateSetting($event)"
    (cancel)="closeEditModal()"
  />
</section>
